<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujos de Caja en Ejecución</title>
<style>
:root {
  --dark: #0d1730;
  --accent: #17a06a;
  --accent-dark: #0f7a52;
  --accent-soft: #e4f7ef;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a1a; }
.topbar { background: var(--dark); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px; }
.topbar h1 { color: #fff; font-size: 13px; font-weight: 600; }
.topbar span { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.btn-refresh { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
.container { max-width: 1200px; margin: 20px auto; padding: 0 12px; }
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.stat-card .lbl { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #888; margin-bottom: 6px; }
.stat-card .val { font-size: 19px; font-weight: 800; color: #1a1a1a; }
.stat-card.ej .val { color: var(--accent-dark); }
.stat-card.sal .val { color: var(--accent); }
.stat-card.pend .val { color: #dc2626; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.filter-group label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #888; }
.filter-group select { padding: 9px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 600; color: #1a1a1a; width: 100%; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #888; margin-bottom: 10px; }

/* --- Vista de tabla (escritorio) --- */
.table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 10px; text-align: left; white-space: normal; line-height: 1.3; }
thead th.num { text-align: right; }
tbody td { padding: 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
tbody tr:nth-child(even) { background: #fafafa; }
tbody tr:hover { background: #f1f1f1; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.detalle { white-space: normal; min-width: 200px; }
.variacion-neg { background: #fde8e8; color: #dc2626; font-weight: 700; border-radius: 6px; }
.pago-si { color: var(--accent-dark); font-weight: 700; }
.pago-no { color: #aaa; }

/* --- Vista de tarjetas (celular) --- */
.card-list { display: none; flex-direction: column; gap: 10px; }
.flujo-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 14px 16px; border-left: 4px solid var(--accent); }
.flujo-card.neg { border-left-color: #dc2626; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.card-numero { font-size: 11px; font-weight: 800; color: #888; text-transform: uppercase; }
.card-detalle { font-size: 14px; font-weight: 700; color: #1a1a1a; margin-top: 2px; }
.card-badge { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.card-badge.si { background: var(--accent-soft); color: var(--accent-dark); }
.card-badge.no { background: #f1f1f1; color: #999; }
.card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; }
.card-item .cl { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #888; }
.card-item .cv { font-size: 14px; font-weight: 700; color: #1a1a1a; }
.card-item.neg .cv { color: #dc2626; }

.no-rows { text-align: center; padding: 40px; color: #aaa; font-size: 13px; }
.loading { text-align: center; padding: 80px; color: #888; font-size: 14px; }
.updated { text-align: center; font-size: 11px; color: #aaa; margin-top: 16px; padding-bottom: 24px; }

@media(max-width: 700px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .table-wrap { display: none; }
  .card-list { display: flex; }
}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>💵 Flujos de Caja en Ejecución</h1>
    <span>Universidad Privada Franz Tamayo — Unifranz CN 2025</span>
  </div>
  <button class="btn-refresh" onclick="cargar()">↻ Actualizar</button>
</div>
<div class="container">
  <div id="contenido"><div class="loading">⏳ Cargando datos...</div></div>
  <div class="updated" id="updated"></div>
</div>
<script>
// ⚠️ URL del deploy del Apps Script de Flujos de Caja (Code_flujos_caja.gs)
const API = "https://script.google.com/macros/s/AKfycbw5g8KNKMKNm_LKuwgHMM1AF4plIL0riX9smqQCGw_kVJrjNkYO9zKhe6E1oU71kZjF/exec";

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let TODAS_LAS_FILAS = [];
let filtroMesActual = "";
let filtroPagoActual = "";

function fmt(n) {
  if (n === null || n === undefined || n === "") return "-";
  const v = Math.round(Number(n));
  const sign = v < 0 ? "- " : "";
  return sign + Math.abs(v).toLocaleString('es');
}

// Convierte "31/07/2026" -> { key: "2026-07", label: "Julio 2026" }
function parseMes(fechaStr) {
  if (!fechaStr) return null;
  const partes = String(fechaStr).split('/');
  if (partes.length < 3) return null;
  const mes = parseInt(partes[1], 10);
  const anio = partes[2];
  if (!mes || mes < 1 || mes > 12) return null;
  return { key: anio + '-' + String(mes).padStart(2, '0'), label: MESES[mes - 1] + ' ' + anio };
}

function poblarFiltroMes(filas) {
  const mapa = new Map();
  filas.forEach(f => {
    const m = parseMes(f.fecha);
    if (m) mapa.set(m.key, m.label);
  });
  const claves = Array.from(mapa.keys()).sort();
  const select = document.getElementById('filtroMes');
  select.innerHTML = '<option value="">Todos los meses</option>' +
    claves.map(k => `<option value="${k}">${mapa.get(k)}</option>`).join('');
  select.value = claves.includes(filtroMesActual) ? filtroMesActual : "";
}

function aplicarFiltros() {
  return TODAS_LAS_FILAS.filter(f => {
    if (filtroMesActual) {
      const m = parseMes(f.fecha);
      if (!m || m.key !== filtroMesActual) return false;
    }
    if (filtroPagoActual === 'SI' && f.pagoTotal !== 'SI') return false;
    if (filtroPagoActual === 'PENDIENTE' && f.pagoTotal === 'SI') return false;
    return true;
  });
}

function renderStats(filas) {
  let totalPres = 0, totalEj = 0, totalPendiente = 0;
  filas.forEach(f => {
    totalPres += Number(f.presupuesto) || 0;
    totalEj += Number(f.ejecutado) || 0;
    if (f.saldo !== null && f.saldo !== undefined) totalPendiente += Number(f.saldo) || 0;
  });
  const totalDif = totalPres - totalEj;

  return `
    <div class="stats">
      <div class="stat-card">
        <div class="lbl">Presupuesto</div>
        <div class="val">Bs ${fmt(totalPres)}</div>
      </div>
      <div class="stat-card ej">
        <div class="lbl">Ejecutado</div>
        <div class="val">Bs ${fmt(totalEj)}</div>
      </div>
      <div class="stat-card sal">
        <div class="lbl">Variación Total</div>
        <div class="val">Bs ${fmt(totalDif)}</div>
      </div>
      <div class="stat-card pend">
        <div class="lbl">Saldo Pendiente</div>
        <div class="val">Bs ${fmt(totalPendiente)}</div>
      </div>
    </div>
  `;
}

function renderTabla(filas) {
  let html = `
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="num">Número<br>Flujo</th>
          <th>Detalle</th>
          <th class="num">Presupuesto</th>
          <th class="num">Ejecución</th>
          <th class="num">Variación</th>
          <th>Pago<br>Total</th>
          <th class="num">Saldo</th>
        </tr>
      </thead>
      <tbody>
  `;

  filas.forEach(f => {
    const dif = Number(f.diferencia) || 0;
    const difClass = dif < 0 ? 'variacion-neg' : '';
    const pagoClass = f.pagoTotal === 'SI' ? 'pago-si' : 'pago-no';
    const pagoTxt = f.pagoTotal === 'SI' ? 'SI' : '—';
    const saldoTxt = (f.saldo === null || f.saldo === undefined) ? '-' : fmt(f.saldo);

    html += `
      <tr>
        <td class="num">${f.numero ?? ''}</td>
        <td class="detalle">${f.detalle ?? ''}</td>
        <td class="num">${fmt(f.presupuesto)}</td>
        <td class="num">${fmt(f.ejecutado)}</td>
        <td class="num ${difClass}">${fmt(f.diferencia)}</td>
        <td class="${pagoClass}">${pagoTxt}</td>
        <td class="num">${saldoTxt}</td>
      </tr>
    `;
  });

  html += `</tbody></table></div>`;
  return html;
}

function renderTarjetas(filas) {
  if (filas.length === 0) return '';
  let html = '<div class="card-list">';

  filas.forEach(f => {
    const dif = Number(f.diferencia) || 0;
    const esNeg = dif < 0;
    const pagoTxt = f.pagoTotal === 'SI' ? 'PAGADO' : 'PENDIENTE';
    const badgeClass = f.pagoTotal === 'SI' ? 'si' : 'no';
    const saldoTxt = (f.saldo === null || f.saldo === undefined) ? '-' : fmt(f.saldo);

    html += `
      <div class="flujo-card ${esNeg ? 'neg' : ''}">
        <div class="card-top">
          <div>
            <div class="card-numero">Flujo N.º ${f.numero ?? ''}</div>
            <div class="card-detalle">${f.detalle ?? ''}</div>
          </div>
          <div class="card-badge ${badgeClass}">${pagoTxt}</div>
        </div>
        <div class="card-grid">
          <div class="card-item">
            <div class="cl">Presupuesto</div>
            <div class="cv">Bs ${fmt(f.presupuesto)}</div>
          </div>
          <div class="card-item">
            <div class="cl">Ejecución</div>
            <div class="cv">Bs ${fmt(f.ejecutado)}</div>
          </div>
          <div class="card-item ${esNeg ? 'neg' : ''}">
            <div class="cl">Variación</div>
            <div class="cv">Bs ${fmt(f.diferencia)}</div>
          </div>
          <div class="card-item">
            <div class="cl">Saldo</div>
            <div class="cv">Bs ${saldoTxt}</div>
          </div>
        </div>
      </div>
    `;
  });

  html += '</div>';
  return html;
}

function render() {
  const filtradas = aplicarFiltros();
  const detalle = filtradas.length === 0
    ? '<div class="no-rows">Sin registros para este filtro.</div>'
    : renderTabla(filtradas) + renderTarjetas(filtradas);

  const html = `
    ${renderStats(filtradas)}
    <div class="filters">
      <div class="filter-group">
        <label>Mes</label>
        <select id="filtroMes" onchange="filtroMesActual=this.value; render();"></select>
      </div>
      <div class="filter-group">
        <label>Estado de Pago</label>
        <select id="filtroPago" onchange="filtroPagoActual=this.value; render();">
          <option value="">Todos</option>
          <option value="SI">Pagado (SI)</option>
          <option value="PENDIENTE">Pendiente</option>
        </select>
      </div>
    </div>
    <div class="section-title">Detalle por Flujo</div>
    ${detalle}
  `;
  document.getElementById('contenido').innerHTML = html;
  poblarFiltroMes(TODAS_LAS_FILAS);
  document.getElementById('filtroPago').value = filtroPagoActual;
}

async function cargar() {
  document.getElementById('contenido').innerHTML = '<div class="loading">⏳ Cargando datos...</div>';
  document.getElementById('updated').textContent = '';
  try {
    const r = await fetch(API);
    const json = await r.json();
    if (json.estado !== 'ok') throw new Error('Error en API');

    TODAS_LAS_FILAS = json.data;
    render();
    document.getElementById('updated').textContent = 'Actualizado: ' + new Date().toLocaleString('es-BO');

  } catch (e) {
    document.getElementById('contenido').innerHTML = '<div class="loading">❌ Error al cargar datos. Intente nuevamente.</div>';
  }
}

cargar();
</script>
</body>
</html>
