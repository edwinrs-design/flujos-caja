<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujos de Caja en Ejecución</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a1a; }
.topbar { background: #1a1a1a; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px; }
.topbar h1 { color: #fff; font-size: 13px; font-weight: 600; }
.topbar span { color: #E85D04; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.btn-refresh { background: #E85D04; color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
.container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.stat-card .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #888; margin-bottom: 6px; }
.stat-card .val { font-size: 24px; font-weight: 800; color: #1a1a1a; }
.stat-card.ej .val { color: #E85D04; }
.stat-card.sal .val { color: #16a34a; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #888; margin-bottom: 12px; }
.table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
thead th { background: #E8580B; color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 12px; text-align: left; white-space: nowrap; }
thead th.num { text-align: right; }
tbody td { padding: 10px 12px; border-bottom: 1px solid #eee; white-space: nowrap; }
tbody tr:nth-child(even) { background: #fafafa; }
tbody tr:hover { background: #f1f1f1; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.detalle { white-space: normal; min-width: 220px; }
.variacion-neg { background: #fde8e8; color: #dc2626; font-weight: 700; border-radius: 6px; }
.pago-si { color: #16a34a; font-weight: 700; }
.pago-no { color: #aaa; }
.loading { text-align: center; padding: 80px; color: #888; font-size: 14px; }
.updated { text-align: center; font-size: 11px; color: #aaa; margin-top: 16px; padding-bottom: 24px; }
@media(max-width: 600px) {
  .stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>💵 Flujos de Caja en Ejecución</h1>
    <span>Universidad Privada Franz Tamayo — Unifranz CN 2025</span>
  </div>
  <button class="btn-refresh" onclick="cargar()">↻ Actualizar</button>
</div>
<div class="container">
  <div id="contenido"><div class="loading">⏳ Cargando datos...</div></div>
  <div class="updated" id="updated"></div>
</div>
<script>
// ⚠️ Reemplaza esta URL con la del deploy del Apps Script de Flujos de Caja (Code_flujos_caja.gs)
const API = "https://script.google.com/macros/s/AKfycbw5g8KNKMKNm_LKuwgHMM1AF4plIL0riX9smqQCGw_kVJrjNkYO9zKhe6E1oU71kZjF/exec";

function fmt(n) {
  if (n === null || n === undefined || n === "") return "-";
  const v = Math.round(Number(n));
  const sign = v < 0 ? "- " : "";
  return sign + Math.abs(v).toLocaleString('es');
}

async function cargar() {
  document.getElementById('contenido').innerHTML = '<div class="loading">⏳ Cargando datos...</div>';
  document.getElementById('updated').textContent = '';
  try {
    const r = await fetch(API);
    const json = await r.json();
    if (json.estado !== 'ok') throw new Error('Error en API');

    const filas = json.data;
    let totalPres = 0, totalEj = 0;
    filas.forEach(f => { totalPres += Number(f.presupuesto) || 0; totalEj += Number(f.ejecutado) || 0; });
    const totalDif = totalPres - totalEj;

    let html = `
      <div class="stats">
        <div class="stat-card">
          <div class="lbl">Presupuesto Total</div>
          <div class="val">Bs ${fmt(totalPres)}</div>
        </div>
        <div class="stat-card ej">
          <div class="lbl">Ejecutado</div>
          <div class="val">Bs ${fmt(totalEj)}</div>
        </div>
        <div class="stat-card sal">
          <div class="lbl">Variación Total</div>
          <div class="val">Bs ${fmt(totalDif)}</div>
        </div>
      </div>
      <div class="section-title">Detalle por Flujo</div>
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="num">Número Flujo</th>
            <th>Fecha de Pago</th>
            <th>Detalle</th>
            <th class="num">Importe Presupuestado</th>
            <th class="num">Ejecución</th>
            <th class="num">Variación</th>
            <th>Pago Total</th>
            <th class="num">Saldo</th>
          </tr>
        </thead>
        <tbody>
    `;

    filas.forEach(f => {
      const dif = Number(f.diferencia) || 0;
      const difClass = dif < 0 ? 'variacion-neg' : '';
      const pagoClass = f.pagoTotal === 'SI' ? 'pago-si' : 'pago-no';
      const pagoTxt = f.pagoTotal === 'SI' ? 'SI' : '—';
      const saldoTxt = (f.saldo === null || f.saldo === undefined) ? '-' : fmt(f.saldo);

      html += `
        <tr>
          <td class="num">${f.numero ?? ''}</td>
          <td>${f.fecha ?? ''}</td>
          <td class="detalle">${f.detalle ?? ''}</td>
          <td class="num">${fmt(f.presupuesto)}</td>
          <td class="num">${fmt(f.ejecutado)}</td>
          <td class="num ${difClass}">${fmt(f.diferencia)}</td>
          <td class="${pagoClass}">${pagoTxt}</td>
          <td class="num">${saldoTxt}</td>
        </tr>
      `;
    });

    html += `</tbody></table></div>`;

    document.getElementById('contenido').innerHTML = html;
    document.getElementById('updated').textContent = 'Actualizado: ' + new Date().toLocaleString('es-BO');

  } catch (e) {
    document.getElementById('contenido').innerHTML = '<div class="loading">❌ Error al cargar datos. Intente nuevamente.</div>';
  }
}

cargar();
</script>
</body>
</html>
